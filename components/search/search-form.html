<form class="ws-search" action="./resultados.html" method="get" role="search" aria-label="Buscador de retiros">
  <div class="ws-search__bar">
    <label class="ws-search__segment ws-search__segment--where">
      <span class="ws-search__label">A donde quieres ir</span>
      <span class="ws-search__control">
        <input
          class="ws-search__input"
          type="search"
          name="donde"
          placeholder="Elige un destino"
          autocomplete="off"
        />
        <span class="ws-search__chevron" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </span>
    </label>
    <div class="ws-search__segment ws-search__segment--dates">
      <span class="ws-search__label" id="ws-search-dates-label">Fechas</span>
      <span class="ws-search__control">
        <input class="ws-search__input" type="date" name="llegada" aria-labelledby="ws-search-dates-label" autocomplete="off" />
        <input class="ws-search__input" type="date" name="salida" aria-label="Salida" autocomplete="off" />
        <span class="ws-search__chevron" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </span>
    </div>
    <label class="ws-search__segment ws-search__segment--guests">
      <span class="ws-search__label">Personas</span>
      <span class="ws-search__control">
        <select class="ws-search__input ws-search__select" name="personas" aria-label="Número de personas">
          <option value="" selected>Personas</option>
          <option value="1">1 persona</option>
          <option value="2">2 personas</option>
          <option value="3">3 personas</option>
          <option value="4">4 personas</option>
          <option value="5">5+ personas</option>
        </select>
        <span class="ws-search__chevron" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </span>
    </label>
    <button class="ws-button ws-button--primary ws-button--icon ws-search__submit" type="submit">
      Buscar
      <span class="ws-button__icon ws-button__icon--desktop" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.49 2 2 6.49 2 12C2 17.51 6.49 22 12 22C17.51 22 22 17.51 22 12C22 6.49 17.51 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="currentColor"/>
          <path d="M11.29 8.71L13.59 11H7V13H13.59L11.29 15.29L12.71 16.71L17.41 12L12.71 7.29L11.29 8.71Z" fill="currentColor"/>
        </svg>
      </span>
      <span class="ws-button__icon ws-button__icon--mobile" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1.33333C4.32667 1.33333 1.33333 4.32667 1.33333 8C1.33333 11.6733 4.32667 14.6667 8 14.6667C11.6733 14.6667 14.6667 11.6733 14.6667 8C14.6667 4.32667 11.6733 1.33333 8 1.33333ZM8 13.3333C5.06 13.3333 2.66667 10.94 2.66667 8C2.66667 5.06 5.06 2.66667 8 2.66667C10.94 2.66667 13.3333 5.06 13.3333 8C13.3333 10.94 10.94 13.3333 8 13.3333Z" fill="currentColor"/>
          <path d="M7.52667 5.80667L9.06 7.33333H4.66667V8.66667H9.06L7.52667 10.1933L8.47333 11.14L11.6067 8L8.47333 4.86L7.52667 5.80667Z" fill="currentColor"/>
        </svg>
      </span>
    </button>
  </div>
</form>
