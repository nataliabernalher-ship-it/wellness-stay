<!-- Figma: WellnessStay Components / newsletter-form (2217:74)
     Device desktop (2216:68) | mobile (2217:75). El layout móvil lo aplica CSS a 560px. -->
<form class="ws-newsletter-form" action="#" method="post">
  <p class="ws-newsletter-form__title">Consejos wellness en tu inbox</p>
  <p class="ws-newsletter-form__text">
    Ideas simples para dormir mejor, moverte con intención, comer más consciente y sostener hábitos que sí duran.
  </p>
  <div class="ws-newsletter-form__row">
    <div class="ws-input">
      <input
        class="ws-input__field"
        type="email"
        name="email"
        id="ws-newsletter-email"
        placeholder="Email"
        autocomplete="email"
        inputmode="email"
        aria-label="Email"
        required
      />
    </div>
    <button class="btn ws-button btn-primary ws-button--primary ws-button--small" type="submit">Aceptar</button>
  </div>
</form>
