<!-- Figma: accommodation-card (2164:255) -->
<article class="ws-card">
  <div class="ws-card__media" data-img="mountain">
    <div class="ws-card__media-top">
      <span class="ws-card__tag"><span class="ws-card__tag-icon" aria-hidden="true"></span>This is a tag</span>
      <button class="ws-card__like" type="button" aria-label="Guardar"></button>
    </div>
    <span class="ws-card__dots" aria-hidden="true"></span>
  </div>
  <div class="ws-card__content">
    <div class="ws-card__top">
      <p class="ws-card__score"><span>9, 4</span><span class="ws-card__score-icon" aria-hidden="true"></span></p>
      <h3 class="ws-card__title">Nombre del alojamiento</h3>
      <p class="ws-card__location">Ubicación</p>
      <p class="ws-card__description">Morem ipsum dolor sit amet, consectetur adipiscing elit. Nunc vulputate libero et velit interdum, ac aliquet odio mattis.</p>
      <p class="ws-card__details">Cancelacion gratuita</p>
    </div>
    <div class="ws-card__footer">
      <p class="ws-card__extra">This is a tag</p>
      <p class="ws-card__price-group">
        <span class="ws-card__price-label">1 noche desde</span>
        <span class="ws-card__price">124€</span>
      </p>
    </div>
  </div>
</article>
